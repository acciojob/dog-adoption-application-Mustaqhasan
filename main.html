<!DOCTYPE html>

<html>

<head>

<body>
	<!-- the entire body must be written by student -->
	<form action="" method="">

		<br>
		<label>Have you ever lived with a dog before?</label>
		<input type="checkbox">
		<br>
		<label>Please select your preffered breed</label>
		<select multiple>
			<option>breed1</option>
			<option>breed2</option>
			<option>breed3</option>
		</select>
		<br>
		<input type="submit" value="submit">
		
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
